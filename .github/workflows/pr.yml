name: Pull Request Checks

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.check-files.outputs.projects }}
    steps:
      - name: Get changed files
        id: files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_ignore: |
            **/*.md
            **/*.json
            **/plugins-list.ts
            **/*.yml

      - name: Check paths
        id: check-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: ${{ steps.files.outputs.all_changed_files }}
        run: |
          # Scheduled and manual runs test everything: every job runs when core is listed
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "projects=core" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          projects=""
          for file in $CHANGED_FILES; do
            if [[ $file == "packages/"* ]]; then
              project=$(echo $file | cut -d'/' -f2)
              projects="$projects $project"
            else
              projects="$projects core"
            fi
          done
          projects=$(echo "$projects" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)
          echo "projects=${projects## }" >> "$GITHUB_OUTPUT"
  tests:
    runs-on: ubuntu-latest
    needs: check-changes
    if: contains(needs.check-changes.outputs.projects, 'core')
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-setup
      - name: Run tests
        run: pnpm test --exclude "**/e2e/**"

  test-file:
    if: contains(needs.check-changes.outputs.projects, 'core') || contains(needs.check-changes.outputs.projects, 'file')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: check-changes
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
      - name: Start web server
        shell: bash
        run: npx --yes http-server ./e2e/web-server-simulation -p 4321 --silent &
      - name: Run tests
        run: pnpm exec vitest run --pool=threads --maxWorkers=1 file.test.ts

  test-dynamo-db:
    needs: check-changes
    if: contains(needs.check-changes.outputs.projects, 'core') || contains(needs.check-changes.outputs.projects, 'dynamo-db')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
      - name: Run tests
        run: pnpm test:ci dynamo-db.test.ts

  test-pg:
    needs: check-changes
    if: contains(needs.check-changes.outputs.projects, 'core') || contains(needs.check-changes.outputs.projects, 'pg')
    runs-on: ubuntu-latest
    services:
      test:
        image: postgres
        ports:
          - 5433:5432
        env:
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_CONNECTION_STRING: postgres://postgres:password@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
      - name: Run tests
        run: pnpm test:ci pg.test.ts

  test-mysql:
    needs: check-changes
    if: contains(needs.check-changes.outputs.projects, 'core') || contains(needs.check-changes.outputs.projects, 'mysql')
    runs-on: ubuntu-latest
    services:
      test:
        image: mysql
        ports:
          - 3307:3306
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
    env:
      MYSQL_CONNECTION_STRING: mysql://root:password@localhost:3307/test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
      - name: Run tests
        run: pnpm test:ci mysql.test.ts

  test-mongo:
    needs: check-changes
    if: contains(needs.check-changes.outputs.projects, 'core') || contains(needs.check-changes.outputs.projects, 'mongo')
    runs-on: ubuntu-latest
    services:
      test:
        image: mongo
        ports:
          - 27018:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: password
    env:
      MONGO_CONNECTION_STRING: mongodb://root:password@localhost:27018/
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
      - name: Run tests
        run: pnpm test:ci mongo.test.ts

  test-redis:
    needs: check-changes
    if: contains(needs.check-changes.outputs.projects, 'core') || contains(needs.check-changes.outputs.projects, 'redis')
    runs-on: ubuntu-latest
    services:
      test:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_CONNECTION_STRING: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
      - name: Run tests
        run: pnpm test:ci redis.test.ts

  test-passed:
    runs-on: ubuntu-latest
    needs:
      - "tests"
      - "test-file"
      - "test-dynamo-db"
      - "test-pg"
      - "test-mysql"
      - "test-mongo"
      - "test-redis"
    if: always()
    steps:
      - name: Check if all tests passed
        run: |
          if [[ ${{ contains(needs.*.result, 'failure') }} == true ]] || [[ ${{ contains(needs.*.result, 'cancelled') }} == true ]]; then
            exit 1
          fi

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
